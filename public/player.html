<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; 
            height: 100%; 
            background: #000; 
            overflow: hidden; 
        }
        #container {
            width: 100%;
            height: 100%;
        }
        video { 
            width: 100%; 
            height: 100%; 
            display: block;
            object-fit: contain;
        }
        .pattern {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
        }
        .pattern h1 { font-size: 32px; margin-bottom: 15px; color: #00ff88; }
        .pattern p { font-size: 16px; color: #999; }
    </style>
</head>
<body>
    <div id="container"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const ch = params.get('channel') || '1';
        const cloudfront = 'd2njmhq33zb6p4.cloudfront.net';

        const isProgram = ch.startsWith('program');
        const channelNum = isProgram ? ch.replace('program', '') : ch;
        const filename = isProgram ? 'program_1.m3u8' : 'stream_1.m3u8';

        const url = `https://${cloudfront}/medialive/channel${channelNum}/${filename}`;

        let retryTimer = null;
        let isStale = false; // Track if we stopped due to stale playlist

        function pattern(reason = 'error') {
            const label = isProgram ? 'PROGRAM' : 'PREVIEW';
            document.getElementById('container').innerHTML = `
                <div class="pattern">
                    <h1>Channel ${channelNum} - ${label}</h1>
                    <p>No stream available</p>
                </div>
            `;

            // Clear any existing retry timer
            if (retryTimer) clearTimeout(retryTimer);

            if (reason === 'stale') {
                // Stale playlist detected - DO NOT RETRY from player side
                // Only retry when server-side status check confirms channel is RUNNING
                console.log('⛔ Stale content detected - player will NOT auto-retry');
                console.log('📡 Server status monitoring will restart player when channel resumes');
                isStale = true;

                // Start polling server to check when channel comes back online
                if (retryTimer) clearTimeout(retryTimer);
                retryTimer = setInterval(async () => {
                    try {
                        const response = await fetch(`/api/channel/${channelNum}/status`, { credentials: 'include' });
                        const data = await response.json();

                        if (data.state === 'RUNNING') {
                            console.log('✅ Channel is RUNNING again - restarting player');
                            clearInterval(retryTimer);
                            retryTimer = null;
                            init();
                        } else {
                            console.log(`Channel status: ${data.state} - waiting...`);
                        }
                    } catch (error) {
                        console.log('Status check error:', error.message);
                    }
                }, 10000); // Check every 10 seconds
            } else {
                // Network error or other issue - retry quickly
                isStale = false;
                retryTimer = setTimeout(init, 3000);
            }
        }

        function init() {
            // When init() is called after stale detection, it's because server confirmed RUNNING
            // Reset stale flag - we're loading fresh live content now
            if (isStale) {
                console.log('🔄 Channel confirmed RUNNING - loading fresh stream');
                isStale = false;
            }

            fetch(url).then(r => {
                if (!r.ok) { pattern(); return; }
                document.getElementById('container').innerHTML = '<video id="v" controls autoplay muted playsinline></video>';
                const v = document.getElementById('v');

                let lastTimeUpdate = Date.now();
                let lastPosition = 0;
                let stallCheckInterval;
                let hlsInstance = null; // Hold reference to HLS instance for cleanup

                // Track playlist staleness - detect when channel stops but cache keeps serving
                // This prevents the "heist movie" problem where CloudFront caches keep serving
                // old segments after the channel stops, making it look like the stream is still live
                let lastSegmentSeen = null;
                let lastNewSegmentTime = Date.now();

                // PROGRAM player needs aggressive detection - this is live event monitoring
                // PREVIEW player can be more lenient
                const STALE_THRESHOLD = isProgram ? 12000 : 20000; // Program: 12s, Preview: 20s
                                                                    // MediaLive writes segments every ~6-10 seconds
                                                                    // Program gets ~1 segment grace period
                                                                    // Preview gets ~2 segment grace period

                // Monitor for stalled playback (stream ended)
                function checkStall() {
                    const now = Date.now();
                    const currentPos = v.currentTime;

                    // If no position change for 10 seconds, assume stream ended
                    if (currentPos === lastPosition && (now - lastTimeUpdate) > 10000) {
                        console.log('Stream stalled - switching to pattern');
                        cleanup();
                        pattern();
                        return;
                    }

                    if (currentPos !== lastPosition) {
                        lastPosition = currentPos;
                        lastTimeUpdate = now;
                    }
                }

                v.addEventListener('timeupdate', () => {
                    lastPosition = v.currentTime;
                    lastTimeUpdate = Date.now();
                });

                // Clean up all intervals and HLS instances
                function cleanup() {
                    if (stallCheckInterval) {
                        clearInterval(stallCheckInterval);
                        stallCheckInterval = null;
                    }
                    if (statusCheckInterval) {
                        clearInterval(statusCheckInterval);
                        statusCheckInterval = null;
                    }
                    if (hlsInstance) {
                        hlsInstance.destroy();
                        hlsInstance = null;
                    }
                }

                // Server-side channel status verification (authoritative source of truth)
                // For PROGRAM players especially - we need to know channel state immediately
                let statusCheckInterval = null;

                async function checkChannelStatus() {
                    try {
                        const response = await fetch(`/api/channel/${channelNum}/status`, {
                            credentials: 'include'
                        });
                        const data = await response.json();

                        if (data.state !== 'RUNNING') {
                            console.log(`⚠️ CHANNEL STATUS: ${data.state} (not RUNNING)`);
                            console.log('Channel stopped - showing offline slide immediately');
                            cleanup();
                            if (statusCheckInterval) clearInterval(statusCheckInterval);
                            pattern('stale');
                        }
                    } catch (error) {
                        // Don't fail on status check errors - playlist monitoring will catch it
                        console.log('Status check error (non-fatal):', error.message);
                    }
                }

                // Monitor for playlist staleness (CloudFront cache serving old segments)
                function checkPlaylistStaleness() {
                    const now = Date.now();
                    const timeSinceNewSegment = now - lastNewSegmentTime;

                    if (lastSegmentSeen && timeSinceNewSegment > STALE_THRESHOLD) {
                        console.log(`⚠️ STALE PLAYLIST DETECTED: No new segments for ${Math.round(timeSinceNewSegment/1000)}s`);
                        console.log('Channel stopped but CloudFront cache still serving old content');
                        console.log('🔒 HEIST PREVENTED: Not retrying for 60s to avoid cached loop');
                        cleanup();
                        if (statusCheckInterval) clearInterval(statusCheckInterval);
                        pattern('stale'); // Pass 'stale' reason to prevent immediate retry
                    }
                }

                // Start monitoring for stalls and staleness every 2 seconds
                stallCheckInterval = setInterval(() => {
                    checkStall();
                    checkPlaylistStaleness();
                }, 2000);

                // Start server-side channel status verification
                // PROGRAM players check aggressively (every 5s) - this is live event monitoring
                // PREVIEW players check less frequently (every 15s)
                const statusCheckFrequency = isProgram ? 5000 : 15000;
                checkChannelStatus(); // Check immediately
                statusCheckInterval = setInterval(checkChannelStatus, statusCheckFrequency);
                console.log(`📡 Server-side status monitoring active (every ${statusCheckFrequency/1000}s)`);

                if (Hls.isSupported()) {
                    hlsInstance = new Hls({
                        debug: false,
                        enableWorker: true,
                        lowLatencyMode: true,
                        backBufferLength: 90
                    });

                    // Monitor manifest updates to detect stale playlists (channel stopped but cache serving old segments)
                    hlsInstance.on(Hls.Events.LEVEL_UPDATED, (event, data) => {
                        const now = Date.now();
                        const details = data.details;

                        if (details && details.fragments && details.fragments.length > 0) {
                            // Get the last segment in the playlist
                            const lastFragment = details.fragments[details.fragments.length - 1];
                            const segmentIdentifier = lastFragment.sn || lastFragment.url;

                            // Check if we're seeing a NEW segment
                            if (segmentIdentifier !== lastSegmentSeen) {
                                console.log('✅ New segment detected:', segmentIdentifier);
                                lastSegmentSeen = segmentIdentifier;
                                lastNewSegmentTime = now;
                            }
                            // Note: Staleness checking handled by checkPlaylistStaleness()
                            // which runs every 2 seconds
                        }
                    });

                    hlsInstance.loadSource(url);
                    hlsInstance.attachMedia(v);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(e => {}));
                    hlsInstance.on(Hls.Events.ERROR, (e, d) => {
                        if (d.fatal) {
                            console.error('HLS Error:', d);
                            cleanup();
                            setTimeout(init, 3000);
                        }
                    });
                } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
                    v.src = url;
                    v.addEventListener('error', () => {
                        cleanup();
                        setTimeout(init, 3000);
                    });
                }
            }).catch(() => pattern());
        }

        init();
    </script>
</body>
</html>
