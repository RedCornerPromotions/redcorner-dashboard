<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12"></script>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; }
        video { width: 100%; height: 100vh; object-fit: contain; }
        .pattern { 
            width: 100%; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            background: #1a1a1a; 
            color: #fff; 
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <script>
        const ch = new URLSearchParams(window.location.search).get('channel') || '1';
        const url = 'http://134.199.150.238:8888/channel' + ch + '/index.m3u8';
        
        function pattern() {
            document.getElementById('container').innerHTML = '<div class="pattern"><h1>CH ' + ch + '</h1><p>No stream</p></div>';
            setTimeout(init, 3000);
        }
        
        function init() {
            fetch(url).then(r => {
                if (!r.ok) { pattern(); return; }
                document.getElementById('container').innerHTML = '<video id="v" controls autoplay muted playsinline></video>';
                const v = document.getElementById('v');
                if (Hls.isSupported()) {
                    const h = new Hls({ debug: false, enableWorker: true, lowLatencyMode: false });
                    h.loadSource(url);
                    h.attachMedia(v);
                    h.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(e => {}));
                    h.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) { h.destroy(); setTimeout(init, 3000); } });
                } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
                    v.src = url;
                }
            }).catch(() => pattern());
        }
        init();
    </script>
</body>
</html>
