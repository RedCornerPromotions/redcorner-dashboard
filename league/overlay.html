<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Rugby League Overlay - Broadcast Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: 'Roboto', 'Arial Black', sans-serif; }

        /* COMPACT SCOREBOARD - Professional Style */
        .scoreboard {
            position: absolute;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.95) 0%, rgba(10, 10, 10, 0.98) 100%);
            border: 3px solid rgba(200, 0, 0, 0.9);
            border-radius: 8px;
            padding: 8px 12px;
            opacity: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        /* POSITION VARIANTS */
        .scoreboard.top-left {
            top: 30px;
            left: 30px;
            animation: slideInFromLeft 0.6s ease-out 0.5s forwards;
        }

        .scoreboard.top-right {
            top: 30px;
            right: 30px;
            animation: slideInFromRight 0.6s ease-out 0.5s forwards;
        }

        .scoreboard.bottom-left {
            bottom: 80px;
            left: 30px;
            animation: slideInFromLeft 0.6s ease-out 0.5s forwards;
        }

        .scoreboard.bottom-right {
            bottom: 80px;
            right: 30px;
            animation: slideInFromRight 0.6s ease-out 0.5s forwards;
        }

        .scoreboard.bottom-center {
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            animation: slideInFromBottom 0.6s ease-out 0.5s forwards;
        }

        .scoreboard.top-center {
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: slideInFromTop 0.6s ease-out 0.5s forwards;
        }

        /* ANIMATIONS */
        @keyframes slideInFromLeft {
            from { opacity: 0; transform: translateX(-100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInFromRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInFromTop {
            from { opacity: 0; transform: translateX(-50%) translateY(-80px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @keyframes slideInFromBottom {
            from { opacity: 0; transform: translateX(-50%) translateY(80px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .scoreboard.hidden {
            animation: fadeOut 0.4s ease-out forwards !important;
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }

        /* TEAM SECTIONS - Compact */
        .team {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 10px;
        }

        .team-abbr {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 45px;
        }

        .team-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .team-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-placeholder {
            font-size: 14px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.6);
        }

        .score {
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            min-width: 40px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        .score.pulse {
            animation: scorePulse 0.5s ease-out;
        }

        @keyframes scorePulse {
            0% { transform: scale(1); color: #ffffff; }
            50% { transform: scale(1.3); color: #ff3333; }
            100% { transform: scale(1); color: #ffffff; }
        }

        /* DIVIDER */
        .divider {
            width: 2px;
            height: 40px;
            background: linear-gradient(180deg, transparent, rgba(200, 0, 0, 0.8), transparent);
            margin: 0 6px;
        }

        /* MIDDLE INFO - Compact */
        .middle {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 12px;
        }

        .period {
            font-size: 11px;
            font-weight: 700;
            color: #ff3333;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .clock {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        .clock.warning {
            color: #ff3333;
            animation: clockBlink 0.5s infinite;
        }

        @keyframes clockBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* TRY CELEBRATION - Broadcast Style */
        .try-celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .try-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(90deg, transparent, rgba(200, 0, 0, 0.95), rgba(200, 0, 0, 0.95), transparent);
            padding: 40px 120px;
            opacity: 0;
            animation: tryBanner 2.5s ease-out;
        }

        .try-text {
            font-size: 100px;
            font-weight: 900;
            color: #ffffff;
            text-shadow:
                0 0 20px rgba(255, 0, 0, 0.8),
                3px 3px 8px rgba(0, 0, 0, 0.9);
            letter-spacing: 8px;
        }

        @keyframes tryBanner {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* FIELD INDICATOR - Minimal */
        .field-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="field-indicator" id="fieldIndicator">F1</div>

    <div class="scoreboard top-center" id="scoreboard">
        <!-- HOME TEAM -->
        <div class="team">
            <div class="team-abbr" id="homeAbbr">HOME</div>
            <div class="team-logo">
                <img id="homeLogo" src="" alt="" style="display: none;">
                <div class="logo-placeholder" id="homeLogoPlaceholder">H</div>
            </div>
            <div class="score" id="homeScore">0</div>
        </div>

        <div class="divider"></div>

        <!-- MIDDLE INFO -->
        <div class="middle">
            <div class="period" id="period">1ST HALF</div>
            <div class="clock" id="clock">40:00</div>
        </div>

        <div class="divider"></div>

        <!-- AWAY TEAM -->
        <div class="team">
            <div class="score" id="awayScore">0</div>
            <div class="team-logo">
                <img id="awayLogo" src="" alt="" style="display: none;">
                <div class="logo-placeholder" id="awayLogoPlaceholder">A</div>
            </div>
            <div class="team-abbr" id="awayAbbr">AWAY</div>
        </div>
    </div>

    <div class="try-celebration" id="tryCelebration"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fieldId = urlParams.get('field') || '1';
        const position = urlParams.get('position') || 'top-center'; // top-left, top-right, top-center, bottom-left, bottom-right, bottom-center
        const storageKey = `leagueOverlay_field${fieldId}`;

        document.getElementById('fieldIndicator').textContent = `F${fieldId}`;

        // Set position
        const scoreboard = document.getElementById('scoreboard');
        scoreboard.className = `scoreboard ${position}`;

        let previousHomeScore = 0;
        let previousAwayScore = 0;

        function getTeamAbbr(name) {
            if (!name || name.length <= 4) return name.toUpperCase();
            // Create 3-4 letter abbreviation
            const words = name.trim().split(' ');
            if (words.length > 1) {
                return words.map(w => w[0]).join('').substring(0, 4).toUpperCase();
            }
            return name.substring(0, 4).toUpperCase();
        }

        function showTryCelebration() {
            const celebration = document.getElementById('tryCelebration');
            const banner = document.createElement('div');
            banner.className = 'try-banner';
            banner.innerHTML = '<div class="try-text">TRY!</div>';
            celebration.appendChild(banner);
            setTimeout(() => banner.remove(), 2500);
        }

        function updateOverlay() {
            const data = JSON.parse(localStorage.getItem(storageKey) || '{}');

            // Update team names (abbreviations)
            if (data.homeName) {
                document.getElementById('homeAbbr').textContent = getTeamAbbr(data.homeName);
                document.getElementById('homeLogoPlaceholder').textContent = data.homeName.charAt(0).toUpperCase();
            }
            if (data.awayName) {
                document.getElementById('awayAbbr').textContent = getTeamAbbr(data.awayName);
                document.getElementById('awayLogoPlaceholder').textContent = data.awayName.charAt(0).toUpperCase();
            }

            // Update logos
            if (data.homeLogo) {
                document.getElementById('homeLogo').src = data.homeLogo;
                document.getElementById('homeLogo').style.display = 'block';
                document.getElementById('homeLogoPlaceholder').style.display = 'none';
            }
            if (data.awayLogo) {
                document.getElementById('awayLogo').src = data.awayLogo;
                document.getElementById('awayLogo').style.display = 'block';
                document.getElementById('awayLogoPlaceholder').style.display = 'none';
            }

            // Update scores with animation
            const homeScore = parseInt(data.homeScore || 0);
            const awayScore = parseInt(data.awayScore || 0);
            const homeScoreEl = document.getElementById('homeScore');
            const awayScoreEl = document.getElementById('awayScore');

            if (homeScore !== previousHomeScore) {
                homeScoreEl.classList.add('pulse');
                if (homeScore - previousHomeScore === 4) {
                    showTryCelebration();
                }
                setTimeout(() => homeScoreEl.classList.remove('pulse'), 500);
                previousHomeScore = homeScore;
            }

            if (awayScore !== previousAwayScore) {
                awayScoreEl.classList.add('pulse');
                if (awayScore - previousAwayScore === 4) {
                    showTryCelebration();
                }
                setTimeout(() => awayScoreEl.classList.remove('pulse'), 500);
                previousAwayScore = awayScore;
            }

            homeScoreEl.textContent = homeScore;
            awayScoreEl.textContent = awayScore;

            // Update clock
            const clockEl = document.getElementById('clock');
            clockEl.textContent = data.clock || '40:00';

            const timeParts = (data.clock || '40:00').split(':');
            const minutes = parseInt(timeParts[0]);
            const seconds = parseInt(timeParts[1]);
            if (minutes === 0 && seconds <= 60) {
                clockEl.classList.add('warning');
            } else {
                clockEl.classList.remove('warning');
            }

            // Update period
            document.getElementById('period').textContent = data.period || '1ST HALF';

            // Show/hide scoreboard
            if (data.visible === false) {
                scoreboard.classList.add('hidden');
            } else {
                scoreboard.classList.remove('hidden');
            }
        }

        window.addEventListener('storage', updateOverlay);
        updateOverlay();
        setInterval(updateOverlay, 100);
    </script>
</body>
</html>
