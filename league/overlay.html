<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Rugby League Overlay - Sky Sports Style</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: 'Roboto', 'Arial', sans-serif; }

        /* SKY SPORTS STYLE - Clean & Elegant */
        .scoreboard {
            position: absolute;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(240, 240, 240, 0.16) 100%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            padding: 8px 10px;
            opacity: 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
        }

        /* POSITION VARIANTS */
        .scoreboard.top-left {
            top: 30px;
            left: 30px;
            animation: slideInFromLeft 0.5s ease-out 0.3s forwards;
        }

        .scoreboard.top-right {
            top: 30px;
            right: 30px;
            animation: slideInFromRight 0.5s ease-out 0.3s forwards;
        }

        .scoreboard.bottom-left {
            bottom: 80px;
            left: 30px;
            animation: slideInFromLeft 0.5s ease-out 0.3s forwards;
        }

        .scoreboard.bottom-right {
            bottom: 80px;
            right: 30px;
            animation: slideInFromRight 0.5s ease-out 0.3s forwards;
        }

        .scoreboard.bottom-center {
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            animation: slideInFromBottom 0.5s ease-out 0.3s forwards;
        }

        .scoreboard.top-center {
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: slideInFromTop 0.5s ease-out 0.3s forwards;
        }

        /* ANIMATIONS */
        @keyframes slideInFromLeft {
            from { opacity: 0; transform: translateX(-80px); }
            to { opacity: 0.8; transform: translateX(0); }
        }

        @keyframes slideInFromRight {
            from { opacity: 0; transform: translateX(80px); }
            to { opacity: 0.8; transform: translateX(0); }
        }

        @keyframes slideInFromTop {
            from { opacity: 0; transform: translateX(-50%) translateY(-60px); }
            to { opacity: 0.8; transform: translateX(-50%) translateY(0); }
        }

        @keyframes slideInFromBottom {
            from { opacity: 0; transform: translateX(-50%) translateY(60px); }
            to { opacity: 0.8; transform: translateX(-50%) translateY(0); }
        }

        .scoreboard.hidden {
            animation: fadeOut 0.3s ease-out forwards !important;
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }

        /* TEAM SECTIONS */
        .team {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            position: relative;
        }

        /* Team color accent bar */
        .team::before {
            content: '';
            position: absolute;
            left: 0;
            top: 4px;
            bottom: 4px;
            width: 4px;
            background: var(--team-color, rgba(255, 255, 255, 0.4));
            border-radius: 2px;
        }

        .team-abbr {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-width: 50px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
        }

        .team-logo {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .team-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-placeholder {
            font-size: 13px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.8);
        }

        .score {
            font-size: 34px;
            font-weight: 900;
            color: #ffffff;
            min-width: 45px;
            text-align: center;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .score.pulse {
            animation: scorePulse 0.4s ease-out;
        }

        @keyframes scorePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: var(--team-color, #4caf50); }
            100% { transform: scale(1); }
        }

        /* DIVIDER */
        .divider {
            width: 1px;
            height: 45px;
            background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            margin: 0 8px;
        }

        /* MIDDLE INFO */
        .middle {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 14px;
            min-width: 110px;
        }

        .period {
            font-size: 10px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
        }

        .clock {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        }

        .clock.warning {
            color: #ff4444;
            animation: clockPulse 1s infinite;
        }

        @keyframes clockPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* TRY POPUP - Small & Elegant */
        .try-popup {
            position: absolute;
            background: var(--team-color, #4caf50);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 20px;
            font-weight: 900;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            opacity: 0;
            z-index: 100;
        }

        .try-popup.home {
            left: -10px;
            top: 50%;
            transform: translate(-100%, -50%);
            animation: tryPopupLeft 1.5s ease-out;
        }

        .try-popup.away {
            right: -10px;
            top: 50%;
            transform: translate(100%, -50%);
            animation: tryPopupRight 1.5s ease-out;
        }

        @keyframes tryPopupLeft {
            0% { opacity: 0; transform: translate(-80%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-100%, -50%) scale(1.1); }
            80% { opacity: 1; transform: translate(-100%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-100%, -50%) scale(0.9); }
        }

        @keyframes tryPopupRight {
            0% { opacity: 0; transform: translate(80%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(100%, -50%) scale(1.1); }
            80% { opacity: 1; transform: translate(100%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(100%, -50%) scale(0.9); }
        }

        /* FIELD INDICATOR */
        .field-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 4px 10px;
            border-radius: 4px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            font-weight: 700;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>
    <div class="field-indicator" id="fieldIndicator">F1</div>

    <div class="scoreboard top-center" id="scoreboard">
        <!-- HOME TEAM -->
        <div class="team" id="homeTeam">
            <div class="team-abbr" id="homeAbbr">HOME</div>
            <div class="team-logo">
                <img id="homeLogo" src="" alt="" style="display: none;">
                <div class="logo-placeholder" id="homeLogoPlaceholder">H</div>
            </div>
            <div class="score" id="homeScore">0</div>
        </div>

        <div class="divider"></div>

        <!-- MIDDLE INFO -->
        <div class="middle">
            <div class="period" id="period">1ST HALF</div>
            <div class="clock" id="clock">40:00</div>
        </div>

        <div class="divider"></div>

        <!-- AWAY TEAM -->
        <div class="team" id="awayTeam">
            <div class="score" id="awayScore">0</div>
            <div class="team-logo">
                <img id="awayLogo" src="" alt="" style="display: none;">
                <div class="logo-placeholder" id="awayLogoPlaceholder">A</div>
            </div>
            <div class="team-abbr" id="awayAbbr">AWAY</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fieldId = urlParams.get('field') || '1';
        const position = urlParams.get('position') || 'top-center';
        const homeColor = urlParams.get('homeColor') || '#0066cc'; // Default blue
        const awayColor = urlParams.get('awayColor') || '#cc0000'; // Default red
        const storageKey = `leagueOverlay_field${fieldId}`;

        document.getElementById('fieldIndicator').textContent = `F${fieldId}`;

        // Set position
        const scoreboard = document.getElementById('scoreboard');
        scoreboard.className = `scoreboard ${position}`;

        // Set team colors
        document.getElementById('homeTeam').style.setProperty('--team-color', homeColor);
        document.getElementById('awayTeam').style.setProperty('--team-color', awayColor);
        document.getElementById('homeScore').style.setProperty('--team-color', homeColor);
        document.getElementById('awayScore').style.setProperty('--team-color', awayColor);

        let previousHomeScore = 0;
        let previousAwayScore = 0;

        function getTeamAbbr(name) {
            if (!name || name.length <= 4) return name.toUpperCase();
            const words = name.trim().split(' ');
            if (words.length > 1) {
                return words.map(w => w[0]).join('').substring(0, 4).toUpperCase();
            }
            return name.substring(0, 4).toUpperCase();
        }

        function showTryPopup(team) {
            const popup = document.createElement('div');
            popup.className = `try-popup ${team}`;
            popup.textContent = 'TRY!';
            popup.style.setProperty('--team-color', team === 'home' ? homeColor : awayColor);
            scoreboard.appendChild(popup);
            setTimeout(() => popup.remove(), 1500);
        }

        function updateOverlay() {
            const data = JSON.parse(localStorage.getItem(storageKey) || '{}');

            // Update team names
            if (data.homeName) {
                document.getElementById('homeAbbr').textContent = getTeamAbbr(data.homeName);
                document.getElementById('homeLogoPlaceholder').textContent = data.homeName.charAt(0).toUpperCase();
            }
            if (data.awayName) {
                document.getElementById('awayAbbr').textContent = getTeamAbbr(data.awayName);
                document.getElementById('awayLogoPlaceholder').textContent = data.awayName.charAt(0).toUpperCase();
            }

            // Update logos
            if (data.homeLogo) {
                document.getElementById('homeLogo').src = data.homeLogo;
                document.getElementById('homeLogo').style.display = 'block';
                document.getElementById('homeLogoPlaceholder').style.display = 'none';
            }
            if (data.awayLogo) {
                document.getElementById('awayLogo').src = data.awayLogo;
                document.getElementById('awayLogo').style.display = 'block';
                document.getElementById('awayLogoPlaceholder').style.display = 'none';
            }

            // Update scores
            const homeScore = parseInt(data.homeScore || 0);
            const awayScore = parseInt(data.awayScore || 0);
            const homeScoreEl = document.getElementById('homeScore');
            const awayScoreEl = document.getElementById('awayScore');

            if (homeScore !== previousHomeScore) {
                homeScoreEl.classList.add('pulse');
                if (homeScore - previousHomeScore === 4) {
                    showTryPopup('home');
                }
                setTimeout(() => homeScoreEl.classList.remove('pulse'), 400);
                previousHomeScore = homeScore;
            }

            if (awayScore !== previousAwayScore) {
                awayScoreEl.classList.add('pulse');
                if (awayScore - previousAwayScore === 4) {
                    showTryPopup('away');
                }
                setTimeout(() => awayScoreEl.classList.remove('pulse'), 400);
                previousAwayScore = awayScore;
            }

            homeScoreEl.textContent = homeScore;
            awayScoreEl.textContent = awayScore;

            // Update clock
            const clockEl = document.getElementById('clock');
            clockEl.textContent = data.clock || '40:00';

            const timeParts = (data.clock || '40:00').split(':');
            const minutes = parseInt(timeParts[0]);
            const seconds = parseInt(timeParts[1]);
            if (minutes === 0 && seconds <= 60) {
                clockEl.classList.add('warning');
            } else {
                clockEl.classList.remove('warning');
            }

            // Update period
            document.getElementById('period').textContent = data.period || '1ST HALF';

            // Show/hide
            if (data.visible === false) {
                scoreboard.classList.add('hidden');
            } else {
                scoreboard.classList.remove('hidden');
            }
        }

        window.addEventListener('storage', updateOverlay);
        updateOverlay();
        setInterval(updateOverlay, 100);
    </script>
</body>
</html>
